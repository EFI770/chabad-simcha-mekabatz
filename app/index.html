<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="מקבץ סיפורי חב\"ד על מעלת השמחה – שיתוף בוואטסאפ" />
  <title>סיפורי שמחה – חב\"ד</title>
  <style>
    :root {
      --parchment: #F3EAD6;
      --ink: #1A1612;
      --techelet: #2F4D6F;
      --seal: #7A3333;
      --card: #FFFEF8;
      --muted: #5a5348;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: \"Segoe UI\", \"Heebo\", \"Rubik\", Arial, sans-serif;
      background: var(--parchment);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100dvh;
    }
    header {
      background: var(--techelet);
      color: #fff;
      padding: 1rem 1.1rem 1.2rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    header h1 { margin: 0 0 .35rem; font-size: 1.35rem; font-weight: 700; }
    header p { margin: 0; font-size: .9rem; opacity: .92; }
    .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }
    input[type=\"search\"] {
      flex: 1; min-width: 160px; padding: .55rem .75rem;
      border: none; border-radius: 8px; font-size: 1rem; direction: rtl;
    }
    .tag-btn {
      background: rgba(255,255,255,.15); color: #fff;
      border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      padding: .35rem .7rem; font-size: .85rem; cursor: pointer;
    }
    .tag-btn.active { background: #fff; color: var(--techelet); }
    main { max-width: 720px; margin: 0 auto; padding: 1rem .9rem 5rem; }
    .count { font-size: .9rem; color: var(--muted); margin: 0 0 .75rem; }
    .card {
      background: var(--card); border: 1px solid #e5dcc8; border-radius: 12px;
      padding: 1rem 1.05rem; margin-bottom: .85rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .card h2 { margin: 0 0 .4rem; font-size: 1.08rem; color: var(--seal); }
    .meta { font-size: .8rem; color: var(--muted); margin-bottom: .55rem; }
    .body { white-space: pre-wrap; font-size: .98rem; margin-bottom: .85rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .75rem; }
    .chip {
      background: #ebe3d1; color: var(--techelet); font-size: .75rem;
      padding: .15rem .5rem; border-radius: 6px;
    }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    button.action {
      flex: 1; min-width: 120px; padding: .55rem .7rem; border: none;
      border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    .wa { background: #25D366; color: #fff; }
    .copy { background: var(--techelet); color: #fff; }
    .toast {
      position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: .55rem 1rem;
      border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none;
      transition: opacity .25s; z-index: 20;
    }
    .toast.show { opacity: 1; }
    footer { text-align: center; font-size: .8rem; color: var(--muted); padding: 1rem; }
    footer a { color: var(--techelet); }
  </style>
</head>
<body>
  <header>
    <h1>סיפורי שמחה – חב\"ד</h1>
    <p>מקבץ מקורות על מעלת השמחה · שיתוף בוואטסאפ</p>
    <div class=\"toolbar\">
      <input type=\"search\" id=\"q\" placeholder=\"חיפוש בסיפורים...\" autocomplete=\"off\" />
      <button type=\"button\" class=\"tag-btn active\" data-tag=\"\">הכל</button>
      <button type=\"button\" class=\"tag-btn\" data-tag=\"ברית מילה\">ברית מילה</button>
      <button type=\"button\" class=\"tag-btn\" data-tag=\"ריי&quot;צ\">ריי\"צ</button>
      <button type=\"button\" class=\"tag-btn\" data-tag=\"צמח צדק\">צמח צדק</button>
    </div>
  </header>
  <main>
    <p class=\"count\" id=\"count\"></p>
    <div id=\"list\"></div>
  </main>
  <footer>
    מקורות חב\"ד ·
    <a href=\"https://github.com/EFI770/chabad-simcha-mekabatz\" target=\"_blank\" rel=\"noopener\">GitHub</a>
  </footer>
  <div class=\"toast\" id=\"toast\">הועתק</div>
  <script>
    let stories = [];
    let activeTag = \"\";
    async function load() {
      try {
        const res = await fetch(\"stories.json\");
        stories = await res.json();
      } catch (e) {
        document.getElementById(\"list\").innerHTML = \"<p>לא ניתן לטעון את הסיפורים.</p>\";
        return;
      }
      render();
    }
    function filtered() {
      const q = (document.getElementById(\"q\").value || \"\").trim().toLowerCase();
      return stories.filter(s => {
        const tagOk = !activeTag || (s.tags && s.tags.some(t => t.indexOf(activeTag) !== -1 || t === activeTag));
        if (!tagOk) return false;
        if (!q) return true;
        const hay = (s.title + \" \" + s.text + \" \" + (s.tags || []).join(\" \") + \" \" + (s.source || \"\")).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
    function render() {
      const items = filtered();
      document.getElementById(\"count\").textContent = items.length + \" סיפורים\";
      const list = document.getElementById(\"list\");
      list.innerHTML = items.map(s => {
        const shareText = encodeURIComponent(\"*\" + s.title + \"*\\n\\n\" + s.text + \"\\n\\n— \" + (s.source || \"מקורות חב\\\"ד\"));
        const wa = \"https://wa.me/?text=\" + shareText;
        const chips = (s.tags || []).map(t => \"<span class=\\\"chip\\\">\" + escapeHtml(t) + \"</span>\").join(\"\");
        return \"<article class=\\\"card\\\" data-id=\\\"\" + s.id + \"\\\"><h2>\" + escapeHtml(s.title) + \"</h2><div class=\\\"meta\\\">\" + escapeHtml(s.source || \"\") + \"</div><div class=\\\"tags\\\">\" + chips + \"</div><div class=\\\"body\\\">\" + escapeHtml(s.text) + \"</div><div class=\\\"actions\\\"><button type=\\\"button\\\" class=\\\"action wa\\\" data-wa=\\\"\" + wa + \"\\\">שליחה בוואטסאפ</button><button type=\\\"button\\\" class=\\\"action copy\\\" data-copy-id=\\\"\" + s.id + \"\\\">העתקה</button></div></article>\";
      }).join(\"\") || \"<p>לא נמצאו סיפורים.</p>\";
      list.querySelectorAll(\"[data-wa]\").forEach(btn => {
        btn.addEventListener(\"click\", () => { window.open(btn.getAttribute(\"data-wa\"), \"_blank\"); });
      });
      list.querySelectorAll(\"[data-copy-id]\").forEach(btn => {
        btn.addEventListener(\"click\", async () => {
          const id = btn.getAttribute(\"data-copy-id\");
          const s = stories.find(x => x.id === id);
          if (!s) return;
          const t = s.title + \"\\n\\n\" + s.text + \"\\n\\n— \" + (s.source || \"\");
          try {
            await navigator.clipboard.writeText(t);
            showToast(\"הועתק ללוח\");
          } catch (e) {
            showToast(\"לא ניתן להעתיק\");
          }
        });
      });
    }
    function escapeHtml(str) {
      return String(str).replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");
    }
    function showToast(msg) {
      const el = document.getElementById(\"toast\");
      el.textContent = msg;
      el.classList.add(\"show\");
      setTimeout(() => el.classList.remove(\"show\"), 1800);
    }
    document.getElementById(\"q\").addEventListener(\"input\", render);
    document.querySelectorAll(\".tag-btn\").forEach(btn => {
      btn.addEventListener(\"click\", () => {
        document.querySelectorAll(\".tag-btn\").forEach(b => b.classList.remove(\"active\"));
        btn.classList.add(\"active\");
        activeTag = btn.getAttribute(\"data-tag\") || \"\";
        render();
      });
    });
    load();
  </script>
</body>
</html>
